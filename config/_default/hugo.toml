# The base URL for the site.
baseURL = 'https://synack-rm-f.github.io/'
# The title of the site.
title = 'synack blog'
# Enable Git info › https://gohugo.io/methods/page/gitinfo/
enableGitInfo = false
# The default content language.
defaultContentLanguage = "en"
# Whether the default content language is in a subdirectory.
defaultContentLanguageInSubdir = false
# Whether the site has CJK language (Chinese, Japanese, Korean).
hasCJKLanguage = true

# Pagination settings.
[pagination]
  pagerSize = 5

# Make sure to include JSON output to support the search functionality.
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Import the theme.
[module]
  [[module.imports]]
    path = "github.com/geekifan/hugo-theme-chirpy"

 # Tu dois obligatoirement remonter le dossier content par défaut d'abord
  [[module.mounts]]
    source = "content"
    target = "content"

  # Tu montes ensuite ton dossier Obsidian externe vers le dossier virtuel content/post
  [[module.mounts]]
    source = "/home/nabiasa/Desktop/vault-obsidian-backup-main/01-Write UP Box & Blog/link"
    target = "content/post"

  [[module.mounts]]
    source = "assets"
    target = "assets"

  [[module.mounts]]
    source = "/home/nabiasa/Desktop/vault-obsidian-backup-main/res"
    target = "assets/res"

 

[security]
  allowContent = ['text/html', 'text/markdown']

 